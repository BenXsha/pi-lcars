<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1600" />
<title>PI AGENT CONSOLE / LCARS 3.1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M0 0h12v20H0zM12 0h20v8H12z' fill='%23ff9c00'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/lcars.css" />
</head>
<body>
<div class="app">

  <!-- ============ LEFT SPINE ============ -->
  <aside class="spine" id="spine">
    <button class="station is-active" data-view="session" style="--w:224px;--h:88px">
      <span class="num">01</span><span class="lbl">SESSION</span>
    </button>
    <button class="station" data-view="tools" style="--w:196px">
      <span class="num">02</span><span class="lbl">TOOLS</span>
    </button>
    <button class="station" data-view="agents" style="--w:168px">
      <span class="num">03</span><span class="lbl">AGENTS</span>
    </button>
    <button class="station" data-view="context" style="--w:204px">
      <span class="num">04</span><span class="lbl">CONTEXT</span>
    </button>
    <button class="station" data-view="skills" style="--w:156px">
      <span class="num">05</span><span class="lbl">SKILLS</span>
    </button>
    <button class="station" data-view="system" style="--w:184px">
      <span class="num">06</span><span class="lbl">SYSTEM</span>
    </button>
    <div class="filler" style="--w:120px;--h:64px"></div>
    <div class="filler" style="--w:88px;--h:36px"></div>
    <div class="tail"></div>
    <div class="version">
      <span>LCARS 3.1 / WEB</span>
      <span class="dim" id="verMode">PI 1.4.0</span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">

    <header class="shelf">
      <div class="shelf-left">
        <span class="brand">PI AGENT CONSOLE</span>
        <span class="station-tag" id="stationTag">MISSION LOG / 01</span>
      </div>
      <div class="shelf-right">
        <span id="shelfModel">—</span>
        <span id="shelfSession">LOCAL</span>
        <span id="shelfClock">T+00:00</span>
      </div>
    </header>

    <div class="body">
      <main class="center">
        <div class="chead">
          <div class="chead-titles">
            <h1 id="viewTitle">SESSION 01 / LCARS CONSOLE</h1>
            <p id="viewMeta">connecting…</p>
          </div>
          <div class="badges">
            <span class="badge moon" id="badgeMode">IDLE</span>
            <span class="badge ice" id="badgeCalls">0 CALLS</span>
            <span class="badge cyan" id="badgeCtx">CTX 0%</span>
          </div>
        </div>

        <div class="scroll" id="scroll">
          <div class="log" id="log"></div>
        </div>

        <form class="cmd" id="cmd">
          <div class="entry-block">
            <span class="entry-label">ENTRY</span>
            <span class="entry-hint" id="entryHint">CTRL K</span>
          </div>
          <div class="cmd-field">
            <div class="cmd-help" id="cmdHelp">ENTER SEND / SHIFT+ENTER NEWLINE</div>
            <div class="cmd-input-row">
              <span class="caret"></span>
              <textarea id="input" rows="1" placeholder="让 pi 构建、重构或调查…" spellcheck="false"></textarea>
            </div>
          </div>
          <button type="submit" class="btn run" id="btnRun">
            <span>RUN</span><em>ENTER</em>
          </button>
          <button type="button" class="btn stop" id="btnStop" disabled>
            <span>STOP</span><em>ESC</em>
          </button>
          <button type="button" class="btn new" id="btnNew">
            <span>NEW</span><em>RESET</em>
          </button>
        </form>
      </main>

      <aside class="rail" id="rail"></aside>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
